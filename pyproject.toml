[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idamap"
version = "0.2.0"
description = "See what your LLM does in IDA: live coverage map, call graph and research log for ida-mcp, for any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "idamap contributors" }]
keywords = ["ida", "ida-pro", "reverse-engineering", "mcp", "llm", "claude", "hex-rays", "visualization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.scripts]
idamap = "idamap.cli:main"

[tool.setuptools]
packages = ["idamap"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
idamap = ["web/*", "web/vendor/*", "ida_scripts/*.py"]
