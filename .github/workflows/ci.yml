name: ci
on: [push, pull_request]

# Nothing here needs more than reading the repository.
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows is untested, see README Compatibility
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # actions are pinned to commit SHAs (a moving tag can be re-pointed); Dependabot proposes updates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --check idamap/web/app.js
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -t . -v
      - run: idamap --version
