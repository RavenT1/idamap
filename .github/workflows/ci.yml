name: ci
on: [push, pull_request]

# Nothing here needs more than reading the repository.
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows is untested, see README Compatibility
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # actions are pinned to commit SHAs (a moving tag can be re-pointed); Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --check idamap/web/app.js
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -t . -v
      - run: idamap --version
